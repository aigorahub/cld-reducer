# Publish the Python package to PyPI when a GitHub release is published.
# PyPI trusted publishing: PyPI accepts this workflow in this repository, so
# no token is stored here.
on:
  release:
    types: [published]
  workflow_dispatch:

name: publish-python.yaml

permissions: read-all

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Check that the release tag matches the package version
        if: github.event_name == 'release'
        run: |
          version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          test "v$version" = "${{ github.event.release.tag_name }}"
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@v1.14.2
        with:
          packages-dir: python/dist/
