name: publish-npm.yaml

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Immutable version tag on main (for example v0.2.0)
        required: true
        type: string
      dry_run:
        description: Build and verify only
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: publish-npm
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag }}

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.tag.outputs.sha }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - id: tag
        run: python scripts/release.py resolve --tag "$RELEASE_TAG"

  build:
    needs: resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: python scripts/release.py version --tag "$RELEASE_TAG"
      - run: npm ci
        working-directory: js
      - run: npm run typecheck && npm run build && npm test && npm run test:conformance
        working-directory: js
      - run: node scripts/check-package.mjs ../bundle/packages
        working-directory: js
      - name: Record the verified artifacts
        env:
          RELEASE_COMMIT: ${{ needs.resolve.outputs.sha }}
        run: python scripts/release.py manifest --registry npm --tag "$RELEASE_TAG" --commit "$RELEASE_COMMIT" --bundle bundle
      - uses: actions/upload-artifact@v7
        with:
          name: npm-candidate
          path: bundle/
          if-no-files-found: error

  publish:
    if: ${{ !inputs.dry_run }}
    needs: [resolve, build]
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@11
      - uses: actions/download-artifact@v8
        with:
          name: npm-candidate
          path: bundle/
      - name: Verify the exact artifacts and reject an existing version
        env:
          RELEASE_COMMIT: ${{ needs.resolve.outputs.sha }}
        run: |
          python scripts/release.py verify --registry npm --tag "$RELEASE_TAG" --commit "$RELEASE_COMMIT" --bundle bundle
          python scripts/release.py available --registry npm --tag "$RELEASE_TAG"
      - run: npm publish bundle/packages/*.tgz --access public
