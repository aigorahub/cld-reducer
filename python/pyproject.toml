[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "cld-reducer"
version = "0.3.0"
description = "Reduce compact letter displays while preserving pairwise statistical relationships"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "John Ennis" },
]
keywords = [
  "compact-letter-display",
  "post-hoc",
  "statistics",
  "sensometrics",
  "mixed-integer-programming",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "highspy>=1.15.1,<1.16",
  "numpy>=1.24",
  "pandas>=2.0",
]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "pytest>=8.0",
  "ruff>=0.8",
  "twine>=6.0",
  "PyYAML>=6.0",
  "tomli>=2.0; python_version < '3.11'",
]

[project.scripts]
cld-reduce = "cld_reducer.cli:main"

[project.urls]
Homepage = "https://github.com/aigorahub/cld-reducer"
Repository = "https://github.com/aigorahub/cld-reducer"
Source = "https://github.com/aigorahub/cld-reducer/tree/main/python"
Issues = "https://github.com/aigorahub/cld-reducer/issues"

[tool.hatch.build.targets.sdist]
include = ["src/cld_reducer", "tests", "examples", "README.md", "LICENSE", "NOTICE"]

[tool.hatch.build.targets.wheel]
packages = ["src/cld_reducer"]

[tool.hatch.build.targets.wheel.force-include]
"NOTICE" = "cld_reducer/NOTICE"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
